models:
    - name: fct_bookings
      description: Факты бронирований
      docs:
        show: true
        node_color: red
      latest_version: 1
      versions:
        - v: 1
      config:
        contract: {enforced: true}
      meta:
        owner: "123@gmail.com"
      columns:
        - name: book_ref
          data_type: varchar(8)
          constraints:
          - type: not_null
        - name: book_date
          data_type: timestamptz
        - name: total_amount
          data_type: numeric(10, 2)
          constraints:
          - type: check
            expression: "total_amount > 0"
          tests:
            - not_null
          meta:
            owner: "finance"
          quote: false


    - name: fct_ticket_flights
      description: Факты привязки билетов к перелетам
      docs:
        show: true
        node_color: green
      config:
        contract: {enforced: true}
      meta:
        owner: "kirik_super@mail.ru"
      columns:
        - name: ticket_no
          data_type: bpchar(13)
          constraints:
          - type: not_null
        - name: flight_id
          data_type: int4
          constraints:
          - type: not_null
        - name: fare_conditions
          data_type: varchar(10)
        - name: amount
          data_type: numeric(10, 2)
          constraints:
          - type: check
            expression: "amount > 0"
        - name: boarding_pass_exists
          data_type: text
        - name: boarding_no
          data_type: int4
        - name: seat_no
          data_type: varchar(4)
        - name: load_date
          data_type: date
          constraints:
          - type: not_null