sources:
  - name: demo_src
    description: Данные из БД авиаперелетов
    tables:
      - name: tickets
        description: Билеты
        columns:
          - name: ticket_no
            description: >
                Номер билета.
                Уникальный идентификатор из 13 цифр
          - name: book_ref
            description: Номер бронирования
          - name: passenger_id
            description: Идентификатор пассажира
          - name: passenger_name
            description: Имя пассажира
          - name: contact_data
            description: Контакты пассажира
      - name: boarding_passes
        columns:
          - name: ticket_no
          - name: flight_id
          - name: boarding_no
          - name: seat_no
      - name: flights
        columns:
          - name: flight_id
          - name: flight_no
          - name: scheduled_departure
          - name: scheduled_arrival
          - name: departure_airport
          - name: arrival_airport
          - name: status
          - name: aircraft_code
          - name: actual_departure
          - name: actual_arrival
        freshness:
          warn_after:
            count: 3650
            period: day
        loaded_at_field: actual_departure::timestamp
      - name: ticket_flights
        columns:
          - name: ticket_no
          - name: flight_id
          - name: fare_conditions
          - name: amount